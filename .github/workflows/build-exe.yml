name: build-exe

# Builds the single-file dtcli.exe on a real Windows machine (PyInstaller
# cannot cross compile), runs the suite there too, and keeps the log so a
# Windows-only failure can be read from the run page.
on:
  push:
    branches: ["main", "arena/**"]
    paths:
      - ".github/workflows/build-exe.yml"
      - "trader-mt5/dtcli.py"
      - "trader-mt5/daytrader.spec"
      - "trader-*/**.py"
  workflow_dispatch:

permissions:
  contents: write            # to publish the built exe as a release asset

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install the build tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller MetaTrader5

      # The log lives outside the checkout: a stray file in the repo root would
      # change the tree the suite checks.
      - name: The suite on Windows (the log is uploaded either way)
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/test-log.txt"
          python -m unittest discover -s tests -v > "$LOG" 2>&1 \
            || echo "TESTS_FAILED" > "$RUNNER_TEMP/tests-failed.txt"
          tail -40 "$LOG"

      - name: What failed, if anything
        if: always()
        shell: bash
        run: |
          LOG="$RUNNER_TEMP/test-log.txt"
          if [ -f "$RUNNER_TEMP/tests-failed.txt" ]; then
            echo "::error::the suite failed on Windows; see test-log.txt in the artifacts"
            grep -E "^(FAIL|ERROR):|AssertionError:" "$LOG" | head -20 | while read -r line; do
              echo "::error::${line}"
            done
          else
            echo "the suite passed on Windows"
          fi

      - name: Build dtcli.exe
        run: pyinstaller --clean --noconfirm trader-mt5/daytrader.spec

      - name: Smoke test the binary (no Python involved)
        shell: cmd
        run: |
          dist\dtcli.exe env
          dist\dtcli.exe list
          dist\dtcli.exe --version
          dist\dtcli.exe mt5 --replay tests\fixtures\trader-mt5\context.json --now "2026-10-20 09:35" account
          dist\dtcli.exe mt5 --replay tests\fixtures\trader-mt5\context.json --now "2026-10-20 09:35" scan --symbols EURUSD --tf M15
          dist\dtcli.exe ticket --help

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dtcli-windows
          path: |
            dist/dtcli.exe
            ${{ runner.temp }}/test-log.txt
          if-no-files-found: warn

      # A plain download link, so nobody has to dig through artifacts:
      # https://github.com/MHR4u/day-trader-skill/releases/download/dtcli-latest/dtcli.exe
      - name: Publish the exe as a release asset
        if: github.ref == 'refs/heads/arena/9ba516af-day-trader-skill'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dtcli-latest >/dev/null 2>&1 || gh release create dtcli-latest \
            --prerelease --target "$GITHUB_SHA" \
            --title "dtcli.exe, the latest Windows build" \
            --notes "One executable for all twelve tools: dtcli.exe list, dtcli.exe mt5 doctor, dtcli.exe lots --write. Built by the build-exe workflow from $GITHUB_SHA. MetaTrader5 is bundled, so a running terminal works without installing Python. Without a terminal, add --replay snapshot.json to any read."
          gh release upload dtcli-latest dist/dtcli.exe --clobber
          gh release edit dtcli-latest --target "$GITHUB_SHA" >/dev/null 2>&1 || true

      - name: Fail the job if the suite failed
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/tests-failed.txt" ]; then exit 1; fi
